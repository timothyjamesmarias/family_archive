production:
  # Solid Queue keeps finished jobs until something clears them. On SQLite
  # that is unbounded growth of storage/production_queue.sqlite3.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development: {}

test: {}
