default: &default
  adapter: postgresql
  encoding: unicode
  # libpq's GSSAPI support segfaults in forked processes on macOS, which is
  # exactly what parallel tests do. Nothing here authenticates via GSS.
  gssencmode: disable
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

local: &local
  <<: *default
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5433) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *local
  database: family_archive_development

test:
  <<: *local
  database: family_archive_test

# Production connection details come entirely from DATABASE_URL (set by Render).
production:
  <<: *default
  database: family_archive_production
